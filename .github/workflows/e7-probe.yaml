name: E7 Probe
on:
  # daily at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e7-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run round (read-only discovery + config gate)
        run: python e7/run_round.py
      - name: Commit results
        run: |
          git config user.name "e7-bot"
          git config user.email "e7-bot@users.noreply.github.com"
          git add e7-results/ e7/known-domains.json
          git diff --cached --quiet || git commit -m "e7 round $(date -u +%Y-%m-%d)"
          git push
